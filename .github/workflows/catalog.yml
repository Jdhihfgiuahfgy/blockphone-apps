# Сводку оценок (reviews/summary.json) — тоже, после каждого нового отзыва.
# После одобрения заявки (Merge) или своей загрузки в apps-src — пересобрать catalog.json.
name: Build catalog
on:
  push:
    branches: [main]
    paths: ["apps-src/**", "reviews/**", "build_catalog.py"]
  workflow_dispatch:
permissions:
  contents: write
# Сборки — строго по очереди (два отзыва подряд запускают две).
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build_catalog.py
      - run: |
          git config user.name "blockphone-bot"
          git config user.email "blockphone-bot@users.noreply.github.com"
          mkdir -p reviews
          git add catalog.json apps icons reviews/summary.json
          git diff --cached --quiet || git commit -m "Каталог обновлён"
          # Пока шла сборка, приёмник мог записать новый отзыв — взять свежий main и собрать заново.
          for i in 1 2 3 4; do
            git push && exit 0
            git fetch origin main && git reset --hard origin/main
            python build_catalog.py
            git add catalog.json apps icons reviews/summary.json
            git diff --cached --quiet && exit 0
            git commit -m "Каталог обновлён"
          done
          exit 1
